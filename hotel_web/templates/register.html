{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Регистрация</h1>
  <form method="post">
    <label>Логин <input type="text" name="username" required></label>
    <label>Пароль (мин. 4 символа) <input type="password" name="password" required minlength="4"></label>
    <label>ФИО <input type="text" name="name" required></label>
    <label>Телефон <input type="text" name="phone" placeholder="+7 900 000-00-00" required></label>
    <label>Почта (необязательно) <input type="email" name="email"></label>
    <button class="btn btn-lg" type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войдите</a></p>
</div>
{% endblock %}
