{% extends "base.html" %}
{% block content %}
<h1>Гости</h1>
<form class="panel filters-panel" method="get">
  <label>Поиск <input type="text" name="q" value="{{ request.args.get('q', '') }}" placeholder="ФИО, телефон или ID"></label>
  <button class="btn" type="submit">Найти</button>
</form>
<table class="table">
  <tr><th>ID</th><th>ФИО</th><th>Телефон</th><th>Почта</th><th>Действия</th></tr>
  {% for g in guests %}
  <tr>
    <td>{{ g.idguests }}</td><td>{{ g.fio }}</td><td>{{ g.phone or '—' }}</td><td>{{ g.email or '—' }}</td>
    <td>
      <form method="post" action="{{ url_for('admin_guest_delete', gid=g.idguests) }}">
        <button class="btn btn-danger btn-sm" type="submit">🗑️</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
