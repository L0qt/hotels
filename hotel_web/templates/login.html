{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Вход</h1>
  <form method="post">
    <label>Логин <input type="text" name="username" required autofocus></label>
    <label>Пароль <input type="password" name="password" required></label>
    <button class="btn btn-lg" type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйтесь</a></p>
  <p class="hint">Тестовые записи: admin / admin123 и user / user123</p>
</div>
{% endblock %}
