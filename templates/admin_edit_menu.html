{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <h2 class="mb-4">Редактировать блюдо</h2>
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Название блюда</label>
                    <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена (мин. 200 ₽)</label>
                    <input type="number" name="price" class="form-control" value="{{ item.price }}" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ item.description }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Доступные ингредиенты (через запятую)</label>
                    <input type="text" name="ingredients" class="form-control" value="{{ item.ingredients }}" placeholder="Сыр, Бекон, Грибы...">
                    <div class="form-text">Гости увидят их в виде галочек в карточке блюда.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Фото блюда</label>
                    {% if item.image %}
                    <div class="mb-2"><img src="{{ item.image }}" style="height: 100px;" class="rounded"></div>
                    {% endif %}
                    <input type="file" name="image" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Обновить</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
