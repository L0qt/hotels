{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <h2 class="mb-4">Добавить блюдо</h2>
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Название блюда</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена (мин. 200 ₽)</label>
                    <input type="number" name="price" class="form-control" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Доступные ингредиенты (через запятую)</label>
                    <input type="text" name="ingredients" class="form-control" placeholder="Сыр, Бекон, Грибы, Без лука...">
                    <div class="form-text">Гости увидят их в виде галочек в карточке блюда.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Фото блюда</label>
                    <input type="file" name="image" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Сохранить</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
